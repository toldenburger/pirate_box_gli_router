# lighttpd config for the box (visitor network only).
# Check it on the router with:  lighttpd -tt -f /mnt/usb/box_conf/lighttpd_box.conf   (no output = fine)
# Needs the packages lighttpd, lighttpd-mod-cgi, lighttpd-mod-accesslog, lighttpd-mod-access (tested with lighttpd 1.4.85).

server.modules = ( "mod_access", "mod_cgi", "mod_accesslog" )

server.document-root = "/mnt/usb/box"
server.bind          = "192.168.60.1"
server.port          = 80
server.pid-file      = "/var/run/lighttpd_box.pid"
server.errorlog      = "/mnt/usb/box_data/web_error.log"
index-file.names     = ( "index.html" )

# access log: client ip, time, request, status, bytes sent
accesslog.filename = "/mnt/usb/box_data/web.log"
accesslog.format   = "%h %t \"%r\" %>s %b"

# uploads: up to ~50 MB (KB units), streamed to the script instead of held in RAM
server.max-request-size   = 51200
server.stream-request-body = 2
server.upload-dirs        = ( "/mnt/usb/box_data/tmp" )

# unknown addresses land on the welcome page
server.error-handler-404 = "/index.html"

# run every file in cgi-bin directly (scripts have their own #! line)
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( "" => "" )
}

# never serve hidden files (half-finished uploads, etc.)
$HTTP["url"] =~ "/\." {
    url.access-deny = ( "" )
}

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "application/javascript; charset=utf-8",
    ".txt"  => "text/plain; charset=utf-8",
    ".epub" => "application/epub+zip",
    ".pdf"  => "application/pdf",
    ".mp3"  => "audio/mpeg",
    ".ogg"  => "audio/ogg",
    ".opus" => "audio/ogg",
    ".m4a"  => "audio/mp4",
    ".flac" => "audio/flac",
    ".wav"  => "audio/wav",
    ".mp4"  => "video/mp4",
    ".webm" => "video/webm",
    ".jpg"  => "image/jpeg",
    ".jpeg" => "image/jpeg",
    ".png"  => "image/png",
    ".gif"  => "image/gif",
    ".webp" => "image/webp",
    ""      => "application/octet-stream"
)
